<title>二曜路8号 · 预约小程序 · 全量需求原型 second-design</title>
<style>
  /* ============ 设计语言：严格对齐已发布版 / v2 原型 ============ */
  :root{
    --ink:#1A1A1A; --ink-2:#555; --ink-3:#999;
    --line:#E7E7E7; --fill:#F5F5F5; --fill-2:#FAFAFA;
    --brand:#7A5230;          /* 棕色：仅点缀（logo 点 / 品牌字 / 标签），不做背景 */
    --orange:#E8833A;         /* 今天橘色圈，仅此一处用彩色 */
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#EDEDED;font-family:-apple-system,"PingFang SC","Helvetica Neue",Helvetica,sans-serif;color:var(--ink);
       display:flex;justify-content:center;padding:24px;gap:32px;flex-wrap:wrap}
  /* 手机外框 */
  .phone{width:390px;background:var(--fill-2);border:1px solid #ddd;border-radius:38px;overflow:hidden;
         box-shadow:0 12px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;height:840px}
  .statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;color:var(--ink)}
  .navbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
          background:#fff;border-bottom:1px solid var(--line)}
  .navbar .t{font-weight:600;font-size:16px}
  .navbar .bk,.navbar .rt{font-size:15px;color:var(--ink-2);min-width:44px}
  .navbar .rt{text-align:right}
  .screen{flex:1;overflow-y:auto;background:var(--fill);padding:16px}
  .screen::-webkit-scrollbar{width:0}
  /* 通用卡片/文字 */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .sec{font-weight:600;font-size:14px;margin-bottom:10px}
  .sec.sm{font-size:12px;color:var(--ink-3);font-weight:500;margin:4px 2px 8px}
  .row{display:flex;align-items:center}
  .between{justify-content:space-between}
  .col{display:flex;flex-direction:column}
  .muted{color:var(--ink-3);font-size:12px}
  .sm{font-size:12px}.xs{font-size:11px}
  .bold{font-weight:600}
  .brand-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:6px;vertical-align:middle}
  .brand-text{color:var(--brand)}
  /* 按钮 */
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;
       border:1px solid var(--ink);border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .btn.block{width:100%;margin-top:6px}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  /* 徽标：靠描边/字重/填充，不引入彩色 */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--ink-2)}
  .badge.ok{border-color:var(--ink);color:var(--ink);font-weight:600}
  .badge.paused{border-style:dashed;color:var(--ink-3)}
  .badge.full{background:var(--fill);color:var(--ink-3)}
  .badge.draft{background:var(--fill);color:var(--ink-3);border-color:var(--line)}
  .badge.shelf{color:var(--ink-3);border-style:dashed}
  .badge.review{color:var(--ink-2)}
  .badge.done{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .badge.expired{border-style:dashed;color:var(--ink-3)}
  /* chip */
  .chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;cursor:pointer}
  .chip.on{border-color:var(--ink);font-weight:600}
  /* 卡片列表项 / 菜单 */
  .item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .menu .mi{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .menu .mi:last-child{border-bottom:none}
  .menu .ma{color:var(--ink-3)}
  .menu .mt{font-weight:500}
  /* 表单 */
  .field{padding:10px 0;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:none}
  .field .label{font-size:11px;color:var(--ink-3);margin-bottom:4px}
  .field input,.field textarea{width:100%;border:none;font-size:13px;outline:none;background:transparent;font-family:inherit}
  .switch{position:relative;width:42px;height:24px;background:var(--line);border-radius:999px;transition:.2s;flex:none}
  .switch.on{background:var(--ink)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
  .switch.on::after{left:20px}
  /* 日历（复用已发布版逻辑 + 最新多选交互） */
  .cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-title{font-weight:600;font-size:13px}
  .cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-week{margin-bottom:5px}
  .cw{text-align:center;font-size:11px;color:var(--ink-3)}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;font-size:10px;cursor:pointer;position:relative}
  .cell.empty{border:none;cursor:default}
  /* 未选中=灰色（禁用观感）；选中（开放）=黑边高亮；今天=橘圈 */
  .cell:not(.open):not(.empty){background:var(--fill);color:var(--ink-3)}
  .cell.open{border-color:var(--ink);color:var(--ink);font-weight:600}
  .cell.today:not(.open)::after{content:"";position:absolute;inset:3px;border:2px solid var(--orange);border-radius:7px}
  .cell.today:not(.open){color:var(--orange);font-weight:600}
  .legend{display:flex;align-items:center;font-size:10px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap;gap:3px}
  .legend .dot{width:9px;height:9px;border-radius:50%;margin-right:3px}
  .legend .dot.open{background:#fff;border:2px solid var(--ink);margin-left:10px}
  .legend .dot.gray{background:var(--fill);border:2px solid var(--line);margin-left:10px}
  .legend .dot.today{background:#fff;border:2px solid var(--orange);margin-left:10px}
  /* 顾客端：横向日期条（替代月历） */
  .datestrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
  .datestrip::-webkit-scrollbar{height:0}
  .dchip{flex:none;width:56px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
  .dchip .wk{font-size:11px;color:var(--ink-3);line-height:1}
  .dchip .dd{font-size:17px;font-weight:600;margin-top:5px;line-height:1.1}
  .dchip .mo{font-size:10px;color:var(--ink-3);margin-top:2px;line-height:1}
  .dchip.off{background:var(--fill);color:var(--ink-3);cursor:default}
  .dchip.off .wk,.dchip.off .dd,.dchip.off .mo{color:var(--ink-3)}
  .dchip.open{border-color:var(--ink);color:var(--ink)}
  .dchip.open .wk{color:var(--ink-2)}
  .dchip.today:not(.on){box-shadow:0 0 0 2px var(--orange);border-color:transparent}
  .dchip.today:not(.on) .wk{color:var(--orange);font-weight:600}
  .dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .dchip.on .wk,.dchip.on .dd,.dchip.on .mo{color:#fff}
  /* 日期整体状态标签：暂停 / 满员 / 已过期（与真机 booking 一致） */
  .dchip.st-paused{border-color:var(--ink-3)}
  .dchip.st-full{border-color:var(--ink-3)}
  .dchip.st-expired{border-color:#8a8f99}
  .chip-tag{margin-top:6rpx;font-size:10px;line-height:1;padding:3px 8px;border-radius:8px}
  .chip-tag.paused{color:#fff;background:var(--ink-3)}
  .chip-tag.full{color:#fff;background:#b06a2c}
  .chip-tag.expired{color:#fff;background:#8a8f99}
  .card.dis{opacity:.45}
  /* 横向日期条：翻页箭头（固定两周，箭头移窗） */
  .datestrip-wrap{display:flex;align-items:center;gap:6px}
  .datestrip{flex:1;margin:0 2px}
  .dnav{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-2);
        display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;user-select:none}
  .dnav:active{border-color:var(--ink)}
  .dnav.disabled{opacity:.25;cursor:not-allowed;pointer-events:none}
  /* 每日场次块 */
  .dayblock{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  .dayblock .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
  .dayblock .dh .dt{font-weight:600;font-size:13px}
  .sess{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
  .sess .st{font-size:13px}
  .sess .sc{font-size:11px;color:var(--ink-2)}
  .ops{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .ops .btn{margin:0}
  .cfgline{display:flex;align-items:center;gap:14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .note{color:var(--ink-3);text-align:center;padding:20px;font-size:12px}
  .empty-sess{color:var(--ink-3);font-size:12px;padding:8px 0}
  /* 底部弹出层（sheet） */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:50}
  .mask.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:390px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px 26px;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet .sh{font-weight:600;font-size:15px;text-align:center;margin-bottom:14px}
  .sheet .opt{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .sheet .opt:last-of-type{border-bottom:none}
  .sheet .opt .sub{font-size:11px;color:var(--ink-3)}
  .sheet .cancel{margin-top:12px;text-align:center;padding:13px;color:var(--ink-2);font-size:14px;background:var(--fill);border-radius:12px;cursor:pointer}
  .sheet .seg{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
  .sheet .seg .chip{cursor:pointer}
  .sheet input.t,.sheet input[type=time],.sheet input[type=number],.sheet input[type=date]{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;width:100%;font-family:inherit;outline:none;box-sizing:border-box}
  .sheet .grp{margin-bottom:14px}
  .sheet .grp .gl{font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .sheet .ck{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
  .sheet .ck:last-child{border-bottom:none}
  .sheet .ck .req{font-size:10px;color:var(--ink-3);margin-left:6px}
  /* 本场预约人弹层（与小程序 admin/sessions 页弹层一致） */
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
  .sheet-head .x{font-size:20px;color:var(--ink-3);line-height:1;cursor:pointer;padding:0 4px}
  .pav{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .person{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
  .person:last-child{margin-bottom:0}
  .person:active{background:var(--fill)}
  .pinfo{flex:1;min-width:0}
  .pinfo .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pinfo .nm{font-size:14px;font-weight:600}
  .pinfo .nm .pp{color:var(--ink-3);font-weight:500;font-size:12px;margin-left:4px}
  .tel{font-size:13px;color:var(--ink);font-weight:500;margin-top:5px}
  .ph-btn{flex:none;color:#fff;background:var(--brand);font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600;border:none;line-height:1}
  .ph-btn:active{opacity:.85}
  .ph-btn.disabled{background:var(--fill);color:var(--ink-3);cursor:not-allowed}
  /* 本场预约人弹层内审核按钮（对应小程序 sessions 页 review-row） */
  .review-row{display:flex;gap:8px;margin-top:10px}
  .rev-btn{flex:1;text-align:center;font-size:12px;font-weight:600;padding:7px 0;border-radius:10px;cursor:pointer;line-height:1}
  .rev-btn.approve{background:#07c160;color:#fff}
  .rev-btn.reject{background:#fff;color:#e34d59;border:1px solid #e34d59}
  .rev-btn:active{opacity:.85}
  /* 详情层（3 列网格） */
  .drow{display:flex;gap:12px;margin-top:14px}
  .dcell{flex:1}
  .dcell .xs{margin-bottom:4px}
  .dval{font-size:14px;color:var(--ink);font-weight:500}
  .time2{display:flex;align-items:center;gap:8px}
  .time2 input{font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;width:90px;text-align:center;font-family:inherit;outline:none}
  /* 屏幕中央弹层（modal，用于添加场次） */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;align-items:center;justify-content:center}
  .modal-mask.show{display:flex}
  .modal{width:300px;background:#fff;border-radius:16px;padding:20px 18px;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}
  .modal .mt{font-size:16px;font-weight:600}
  .modal .mb{font-size:12px;color:var(--ink-2);margin-top:10px;line-height:1.6}
  .modal .macts{display:flex;gap:10px;margin-top:18px}
  .modal .macts .btn{flex:1}
  /* 店铺菜单 / 评价（与首页风格统一：白卡、黑字、棕色仅点缀） */
  .prod-img{width:56px;height:56px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  .stars{display:inline-flex;gap:3px;font-size:18px;color:var(--line);line-height:1}
  .stars .on{color:var(--brand)}
  .stars.lg{font-size:24px}
  .rev{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .rev:first-of-type{border-top:none;padding-top:0}
  .rev .av{width:32px;height:32px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .rev .rt{font-size:11px;color:var(--ink-3)}

  /* 标签 / tab / kv / 角色切换 */
  .pill{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px}
  .tag-brand{color:var(--brand);border-color:var(--brand)}
  .tag-ok{color:var(--ink);border-color:var(--ink)}
  .tab{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .tab .tb{flex:1;text-align:center;padding:9px;font-size:12px;cursor:pointer}
  .tab .tb.on{background:var(--ink);color:#fff}
  /* 底部 tabBar（同步自真机 app.json tabBar：首页 / 我的预约） */
  .bottom-nav{display:flex;border-top:1px solid var(--line);background:#fff;flex:none}
  .bottom-nav .bn-item{flex:1;text-align:center;padding:12px 0 10px;font-size:13px;color:var(--ink-3);cursor:pointer}
  .bottom-nav .bn-item.on{color:var(--ink);font-weight:600}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border-bottom:none}
  .center{text-align:center}
  /* 角色选择 / hero / 头像 / 登录 */
  .rolecard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;cursor:pointer;background:#fff}
  .rolecard:active{border-color:var(--ink)}
  .rolecard .ic{width:40px;height:40px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:20px}
  .rolecard .nm{font-weight:600;font-size:14px}
  .rolecard .ds{font-size:11px;color:var(--ink-3);margin-top:2px}
  .hero{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
  .hero .img{height:140px;background:linear-gradient(135deg,#26211c,#3d3026);display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:6px}
  .hero .img .logo{font-size:20px;font-weight:700;letter-spacing:1px;color:#fff;position:relative}
  .hero .img .logo::after{content:'';position:absolute;right:-13px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .hero .img .tag{font-size:11px;opacity:.85;letter-spacing:1px;color:var(--brand)}
  .hero .img.hero-photo{background:var(--fill);border:1px dashed var(--line);color:var(--ink-3);gap:8px}
  .hero .img.hero-photo .hp-t{font-size:13px;color:var(--ink-2)}
  .hero .img.hero-photo .tag{color:var(--brand)}
  .hero .txt{padding:14px}
  .hero .txt h2{font-size:17px;font-weight:700;margin-bottom:4px}
  .hero .txt p{font-size:13px;color:var(--ink-2);line-height:1.6}
  .avatar-row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
  .avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--line);cursor:pointer}
  .avatar.on{border-color:var(--ink)}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .stepper button{width:34px;height:34px;border:0;background:#fff;font-size:18px;cursor:pointer;color:var(--ink);font-family:inherit}
  .stepper .v{min-width:38px;text-align:center;font-size:15px;font-weight:600}
  .fld{border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-size:14px;font-family:inherit;box-sizing:border-box;outline:none;margin-bottom:10px}
  .fld:focus{border-color:var(--ink)}
  .verify{display:flex;align-items:center;gap:8px;margin-top:6px}
  .verify .ok{color:var(--ink);font-size:11px;font-weight:600}
  /* .person / .pav / .pinfo / .tel / .ph-btn 等弹层样式见上方「本场预约人弹层」区块（已对齐小程序 sessions 页） */
  .detail .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .detail .kv .k{color:var(--ink-2)}
  .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}

  /* 图片上传 / 介绍图片（与真实小程序一致：菜品是图片，非图标） */
  .tip{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.5}
  .up{width:100%;height:120px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:12px;background:var(--fill);cursor:pointer;overflow:hidden;margin-bottom:4px}
  .up img{width:100%;height:100%;object-fit:cover}
  .prod-img img{width:100%;height:100%;object-fit:cover;border-radius:12px}
  .prod-img .ph{font-size:11px;color:var(--ink-3)}
  .prod-logo{width:44px;height:44px;border-radius:10px;background:rgba(122,82,48,.08);display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:11px;flex:none}
  .prod-logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}

/* ===================== 预约截止规则（与真机 util.js / projectConfig 一致） ===================== */
// 归一化截止规则为新模型 { mode:'before'|'after', minutes }，兼容旧 {type:'场次前'|'当日',hours|time}
function normCutoff(c) {
  if (c && (c.mode === 'before' || c.mode === 'after') && Number(c.minutes) > 0)
    return { mode: c.mode, minutes: Math.min(1440, Math.max(1, Number(c.minutes))) }
  if (c && c.type === '场次前' && Number(c.hours) > 0)
    return { mode: 'before', minutes: Math.min(1440, Math.max(1, Math.round(Number(c.hours) * 60))) }
  return { mode: 'before', minutes: 30 }
}
function cutoffText(c) {
  const n = normCutoff(c);
  return (n.mode === 'before' ? '场次开始前 ' : '场次开始后 ') + n.minutes + ' 分钟';
}
// 某场次是否已超过预约截止（无规则/非法则视为不过期，避免旧项目突然全过期）——与真机 util.js 逐字一致
function parseHm(hm) { const [h, m] = hm.split(':').map(Number); return h * 60 + m; }
function isSessionExpired(dateStr, startStr, cutoff) {
  if (!cutoff || (cutoff.mode !== 'before' && cutoff.mode !== 'after') || !(Number(cutoff.minutes) > 0)) return false;
  const [y, mo, d] = dateStr.split('-').map(Number);
  const base = new Date(y, mo - 1, d);
  const mins = parseHm(startStr);
  const deadline = new Date(base); deadline.setHours(0, 0, 0, 0); deadline.setMinutes(mins);
  if (cutoff.mode === 'before') deadline.setMinutes(deadline.getMinutes() - Number(cutoff.minutes));
  else deadline.setMinutes(deadline.getMinutes() + Number(cutoff.minutes));
  return new Date().getTime() >= deadline.getTime();
}

function cBooking(pid){
  const p=projects.find(x=>x.id===pid);
  /* 切换项目时重置翻页锚点；否则保留当前翻到的两周 */
  if(state._bookingPid !== pid){ state._bookingPid = pid; state.dateAnchor = null; state.bookingDay = null; }
  if(!state.dateAnchor) state.dateAnchor = new Date(Y, M-1, today.getDate());
  /* 横向日期条：固定两周（14 天），以锚点为起点 */
  const adv = (p.g.open && p.g.open.adv) || 0;
  const t0 = new Date(Y, M-1, today.getDate());
  const maxWin = new Date(t0); maxWin.setDate(maxWin.getDate() + adv);
  const anchor = new Date(state.dateAnchor);
  const WD = ['日','一','二','三','四','五','六'];
  const tmr = new Date(t0); tmr.setDate(tmr.getDate()+1);
  const strip = [];
  let hasOpen = false, prevMonth = -1;
  for(let i=0;i<14;i++){
    const cur = new Date(anchor); cur.setDate(anchor.getDate()+i);
    const iso = ymd(cur.getFullYear(), cur.getMonth()+1, cur.getDate());
    const inWin = cur <= maxWin;
    const isOpen = p.openDays.includes(iso) && inWin;
    if(isOpen) hasOpen = true;
    const isToday = cur.getTime()===t0.getTime();
    const isTmr = cur.getTime()===tmr.getTime();
    const wk = isToday ? '今天' : (isTmr ? '明天' : '周'+WD[cur.getDay()]);
    const md = `${String(cur.getMonth()+1).padStart(2,'0')}/${String(cur.getDate()).padStart(2,'0')}`;
    const sel = state.bookingDay===iso;
    // 当日整体状态（仅对可约日有意义）：项目暂停→暂停；否则看当日场次
    let dayStatus = '';
    if (isOpen) {
      const sess = (p.sessions[iso]||[]).map(s=>({
        remaining:(s.max||0)-(s.booked||0),
        paused:(s.status==='paused'),
        expired:isSessionExpired(iso, s.start, p.cutoff)
      }));
      if (p.paused) dayStatus='paused';
      else if (sess.length) {
        const allPaused = sess.every(x=>x.paused);
        const allExpired = sess.every(x=>x.expired);
        const allFull = sess.every(x=>(x.remaining)<=0);
        if (allPaused) dayStatus='paused';
        else if (allExpired) dayStatus='expired';
        else if (allFull) dayStatus='full';
      }
    }
    const cls = ['dchip', isOpen?'open':'off', isToday?'today':'', sel?'on':'', dayStatus?('st-'+dayStatus):''].join(' ');
    const click = isOpen ? `onclick="cPickDay('${pid}','${iso}')"` : '';
    const tag = dayStatus ? `<div class="chip-tag ${dayStatus}">${dayStatus==='paused'?'暂停':(dayStatus==='full'?'满员':'已过期')}</div>` : '';
    strip.push(`<div class="${cls}" ${click}>
        <div class="wk">${wk}</div>
        <div class="dd">${md}</div>
        ${tag}
      </div>`);
  }
  const stripHTML = strip.join('');
  const a0 = new Date(anchor), a1 = new Date(anchor); a1.setDate(a1.getDate()+13);
  const rangeLabel = `${a0.getMonth()+1}/${a0.getDate()} – ${a1.getMonth()+1}/${a1.getDate()}`;
  const canLeft = anchor > t0;
  let grid=`<div class="note">请选择上方可预约日期查看场次。</div>`;
  if(state.bookingDay){
    const raw=(p.sessions[state.bookingDay]||[]);
    if(!raw.length) grid=`<div class="note">该日已开放预约，但暂未设置场次，请联系店家。</div>`;
    else grid=raw.map(s=>{
      const remaining=(s.max||0)-(s.booked||0);
      const paused=(s.status==='paused');
      const expired=isSessionExpired(state.bookingDay, s.start, p.cutoff);
      const blocked=!!p.paused;            // 项目整体暂停时全部不可选（与真机一致）
      let badge, sub, dis, bcls;
      if (expired) { badge='已过期'; sub='本场已过期'; dis=true; bcls='expired'; }
      else if (paused || blocked) { badge='已暂停'; sub='本场已暂停'; dis=true; bcls='paused'; }
      else if (remaining<=0) { badge='已满'; sub='人数已满'; dis=true; bcls='full'; }
      else { badge=`剩 ${remaining}/${s.max}`; sub='点击选择该场次'; dis=false; bcls='ok'; }
      const cls='card tap'+(dis?' dis':'');
      const click = dis ? '' : `onclick="cPickSession('${pid}','${state.bookingDay}','${s.start}')"`;
      return `<div class="${cls}" ${click}>
        <div class="row between"><div style="font-weight:600">${s.start} – ${s.end}</div><span class="badge ${bcls}">${badge}</span></div>
        <div class="xs muted" style="margin-top:6px">${sub}</div>
      </div>`;
    }).join('');
  }
  const html=`${introBlock(p)}
    <div class="card">
      <div class="sec row between">选择日期<span class="muted" style="font-weight:400">${rangeLabel}</span></div>
      <div class="datestrip-wrap">
        <div class="dnav ${canLeft?'':'disabled'}" onclick="${canLeft?"cMoveDate(-14)":''}">‹</div>
        <div class="datestrip">${stripHTML}</div>
        <div class="dnav" onclick="cMoveDate(14)">›</div>
      </div>
      <div class="xs muted" style="margin-top:6px">可预约日期高亮，点击查看场次${canLeft?'；':'；已是最早（今天起）'}向左箭头可看更早日期。</div>
      ${hasOpen?'':`<div class="note" style="padding:10px 0">当前预约窗口内暂无可约日期，请稍后再来或联系店家。</div>`}
    </div>
    <div class="sec" style="margin-top:14px">可约场次</div>
    ${grid}`;
  nav(html,p.name);
}

function cMoveDate(delta){

  const maxN=projects.map(p=>parseInt((p.id||'').replace('p',''),10)||0).reduce((a,b)=>Math.max(a,b),0);

  projects.push({ id, name, published:false, paused:false, deleted:false,
    openDays:[], sessions:{}, introImages:[],
    image:'', intro,
    g:{ needReview:false, paused:false, smsEnabled:false,
        maxParty:2, subscribeNotify:true,
        limit:{period:'每天',count:1,adminFree:true},
        open:{type:'提前天数',adv:1},
        cutoff:{mode:'before',minutes:30},
        fields:['name','phone'] } });
  closeModal();
  toast('已创建：'+name);
  aConfig(id);
}

}
function introCaps(p){
  return (p.introImages||[]).map((it,i)=>`<div class="field"><div class="label">第 ${i+1} 张说明（可选）</div><input id="icap${i}" value="${it.caption||''}" placeholder="如：店内环境 / 出品特写"></div>`).join('');

function introDelete(i){ const p=state.project; if(!p.introImages||!p.introImages[i])return; openModal(`<div class="mt">删除介绍图片</div><div class="mb">将同步清理云存储文件，避免孤儿文件。</div><div class="macts"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="doIntroDelete(${i})">删除</button></div>`); }
function doIntroDelete(i){ const p=state.project; p.introImages.splice(i,1); closeModal(); aConfig(); toast('已删除'); }
function introMove(i,d){ const p=state.project; const a=p.introImages; const j=i+d; if(!a||j<0||j>=a.length) return; const t=a[i]; a[i]=a[j]; a[j]=t; a.forEach((x,k)=>x.sort=k); aConfig(); }
function saveIntroCaps(){ const p=state.project; (p.introImages||[]).forEach((it,i)=>{ const el=document.getElementById('icap'+i); if(el) it.caption=el.value; }); toast('说明已保存'); }
function coverPick(){ const p=state.project; const el=document.getElementById('pintro'); if(el) p.intro=el.value; p.image="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='400' height='300' fill='%23EDE6DD'/><text x='200' y='145' font-size='20' fill='%237A5230' text-anchor='middle' font-family='sans-serif'>店铺实景 / 菜单主图</text><text x='200' y='172' font-size='13' fill='%23999' text-anchor='middle' font-family='sans-serif'>（演示图，管理端可替换）</text></svg>"; aCover(); toast('已设置主图（演示）'); }

/* 日历渲染 */
function calHTML(p){
  const y=state.year,m=state.month;
  const first=new Date(y,m-1,1).getDay();
  const days=new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<first;i++) cells+=`<div class="cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=ymd(y,m,d);
    const md=`${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
    const open=p.openDays.includes(k);
    const isToday=k===TODAY;
    cells+=`<div class="cell ${open?'open':''} ${isToday?'today':''}" onclick="toggleDate('${k}')">${md}</div>`;
  }
  return `<div class="cal">
    <div class="cal-hd">
      <div class="btn ghost sm" onclick="calMove(-1)">‹</div>
      <div class="cal-title">${y} 年 ${m} 月</div>
      <div class="btn ghost sm" onclick="calMove(1)">›</div>
    </div>
    <div class="cal-week">${['日','一','二','三','四','五','六'].map(w=>`<div class="cw">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}
function calMove(d){ let m=state.month+d,y=state.year; if(m<1){m=12;y--;} if(m>12){m=1;y++;} state.month=m; state.year=y; aConfig(); }
function toggleDate(k){ const p=state.project; const i=p.openDays.indexOf(k); if(i>=0)p.openDays.splice(i,1); else p.openDays.push(k); aConfig(); }
function batchAll(on){ const p=state.project; const y=state.year,m=state.month;
  const all=[]; for(let d=1;d<=new Date(y,m,0).getDate();d++) all.push(ymd(y,m,d));
  if(on){ all.forEach(d=>{ if(!p.openDays.includes(d)) p.openDays.push(d); }); }
  else { p.openDays=p.openDays.filter(d=>!d.startsWith(ymd(y,m,1).slice(0,7))); }
  aConfig(); toast(on?'本月已全开':'本月已全关');
}

function dayBlocksHTML(p){
  if(!p.openDays.length) return '<div class="note">尚未选择开放日期，点上方日历添加。</div>';

  return list.map(k=>{
    const sess=(p.sessions[k]||[]);
    return `<div class="dayblock">
      <div class="dh"><div class="dt">${k} <span class="badge ok">开放</span></div>
        <div class="ops">
          <button class="btn ghost sm" onclick="addSession('${k}')">+ 添加</button>
          <button class="btn ghost sm" onclick="useTemplate('${k}')">模版</button>
          <button class="btn ghost sm" onclick="copyDay('${k}')">复制</button>
          <button class="btn ghost sm" onclick="clearDaySessions('${k}')">清空</button>

      </div>

        : `<div class="empty-sess">暂无场次，点「模版」快速套用</div>` }
    </div>`;
  }).join('');
}

function doCopy(k,mode){
  const src=state.project.sessions[k]||[];

/* ---- 查看预约人（默认法兰绒深烘） ---- */
function aView(){
  if(!state.viewProject) state.viewProject=projects[0];
  const p=state.viewProject;
  const t0=new Date(Y,M-1,today.getDate());
  const WD=['日','一','二','三','四','五','六'];
  const dA=new Date(t0); dA.setDate(dA.getDate()+2);
  const dB=new Date(t0); dB.setDate(dB.getDate()+6);
  const demo=[
    {name:'张女士',phone:'138****8021',party:2,review:'ok',day:ymd(dA.getFullYear(),dA.getMonth()+1,dA.getDate()),time:'10:00–11:30'},
    {name:'李先生',phone:'139****3390',party:1,review:'pending',day:ymd(dB.getFullYear(),dB.getMonth()+1,dB.getDate()),time:'14:00–15:30'}
  ];
  /* 横向日期条：固定两周（14 天），以锚点为起点；有预约的日期高亮 */
  if(!state.viewAnchor) state.viewAnchor=new Date(Y,M-1,today.getDate());
  const anchor=new Date(state.viewAnchor);
  const demoDays=new Set(demo.map(d=>d.day));
  const days=[];
  for(let i=0;i<14;i++){
    const cur=new Date(anchor); cur.setDate(anchor.getDate()+i);
    const iso=ymd(cur.getFullYear(),cur.getMonth()+1,cur.getDate());
    days.push({cur,iso,isToday:cur.getTime()===t0.getTime(),has:demoDays.has(iso)});
  }
  /* 默认选中：未选或所选当日无预约 → 选首个有预约的日期 */
  if(!state.viewDay || !demoDays.has(state.viewDay)){
    const first=days.find(d=>d.has);
    state.viewDay=first?first.iso:null;
  }
  let prevMonth=-1;
  const strip=days.map(({cur,iso,isToday,has})=>{
    const wk=isToday?'今天':'周'+WD[cur.getDay()];
    const moLbl=(cur.getMonth()!==prevMonth)?`${cur.getMonth()+1}月`:'';
    prevMonth=cur.getMonth();
    const sel=state.viewDay===iso;
    const cls=['dchip',has?'open':'off',isToday?'today':'',sel?'on':''].join(' ');
    const click=has?`onclick="vPickDay('${iso}')"`:'';
    return `<div class="${cls}" ${click}>
        ${moLbl?`<div class="mo">${moLbl}</div>`:''}
        <div class="wk">${wk}</div>
        <div class="dd">${cur.getDate()}</div>
      </div>`;
  }).join('');
  const a0=new Date(anchor),a1=new Date(anchor); a1.setDate(a1.getDate()+13);
  const rangeLabel=`${a0.getMonth()+1}/${a0.getDate()} – ${a1.getMonth()+1}/${a1.getDate()}`;
  const canLeft=anchor>t0;
  const list=state.viewDay?demo.filter(r=>r.day===state.viewDay):[];
  const html=`<div class="card row between tap" onclick="aPickView()">
      <div class="bold">${p.name}</div><div class="muted">切换 ›</div></div>
    <div class="card">
      <div class="sec row between">选择日期<span class="muted" style="font-weight:400">${rangeLabel}</span></div>
      <div class="datestrip-wrap">
        <div class="dnav ${canLeft?'':'disabled'}" onclick="${canLeft?"vMoveDate(-14)":''}">‹</div>
        <div class="datestrip">${strip}</div>
        <div class="dnav" onclick="vMoveDate(14)">›</div>
      </div>
      <div class="xs muted" style="margin-top:6px">有预约的日期高亮，点击查看当天预约人${canLeft?'；':''}向左箭头可看更早日期。</div>
    </div>
    <div class="tab">
      <div class="tb on">待审核</div><div class="tb">已通过</div><div class="tb">已取消</div>
    </div>
    ${list.length?list.map((r,i)=>`
      <div class="person" onclick="showPerson('${r.name}','${r.phone}','${r.party}','${r.review}','${r.day}','${r.time}')">
        <div class="pav">${r.name[0]}</div>
        <div class="pinfo">
          <div class="top"><div class="nm">${r.name}<span class="pp">· ${r.party}人</span></div>${pBadge(r)}</div>
          <div class="tel">${r.phone?('☎ '+r.phone):'无号码'}</div>
        </div>
        <div class="ph-btn ${r.phone?'':'disabled'}" onclick="event.stopPropagation();dial('${r.phone}')">📞 拨打</div>
      </div>`).join(''):`<div class="note">所选日期暂无预约人。</div>`}
    <div class="note">默认选中「法兰绒深烘咖啡预约」，点顶部可切换项目。</div>`;
  nav(html,'查看预约');
}

/* ---- 当日场次管理（owner / manager 共用，逻辑一致） ---- */
/* manager 仅显示被授权项目；owner 显示全部项目。进入即展示今天（TODAY）的场次。 */
function aDaily(){
  const isOwner=state.role==='owner';
  const list = isOwner ? projects : projects.filter(p=>mgrProjects.includes(p.id));
  const sections = list.map(p=>{
    const sess=(p.sessions[TODAY]||[]).map(s=>({...s, booked:s.booked||0, status:s.status||'open'}));
    return {p,sess};
  });
  let body='';
  sections.forEach(({p,sess})=>{
    body += `<div class="card">
      <div class="row between"><div class="row"><span class="brand-dot"></span><span class="bold">${p.name}</span></div>
        <span class="badge ${!p.published?'draft':(p.paused?'shelf':'ok')}">${!p.published?'未发布':(p.paused?'暂停预约':'已发布')}</span></div>`;
    if(!sess.length){
      body += `<div class="empty-sess">今日（${TODAY}）暂无场次</div>`;
    } else {
      sess.forEach((s,idx)=>{
        const open=s.status==='open';
        body += `<div class="sess"><div class="col">
            <div class="st">${s.start} – ${s.end}</div>
            <div class="sc">已约 ${s.booked}/${s.max} 人</div>
          </div>
          <div class="row" style="gap:8px">
            <span class="badge ${open?'ok':'paused'}">${open?'开放预约':'暂停预约'}</span>
            <button class="btn ghost sm" onclick="dailyToggle('${p.id}',${idx})">${open?'暂停':'开放'}</button>
            <button class="btn ghost sm" onclick="dailyCap('${p.id}',${idx})">人数</button>
            <span style="margin-left:auto;color:var(--brand);font-size:12px;cursor:pointer" onclick="showSessionPeople('${p.id}',${idx})">👥 查看本场预约人 ›</span>
          </div></div>`;
      });
      body += `<button class="btn ghost sm" style="margin-top:8px" onclick="dailyAdd('${p.id}')">+ 增加场次</button>`;
    }
    body += `</div>`;
  });
  if(!sections.length) body='<div class="note">暂无可管理项目。</div>';
  const html=`<div class="sec">当日场次管理 <span class="pill tag-brand">${TODAY}</span></div>
    <div class="xs muted" style="margin-bottom:10px">${isOwner?'全部项目 · 可开放/暂停/调人数/加场次':'仅你被授权的项目 · 可开放/暂停/调人数/加场次'}</div>
    ${body}
    <div class="note">${isOwner?'超级管理员可对全部项目的当日场次做开放/暂停、人数与新增管理。':'普通管理员仅能管理其被授权项目的当日场次（不接触项目配置/发布）。'}</div>`;
  nav(html,'当日场次管理');
}
function dailyToggle(pid,idx){
  const p=projects.find(x=>x.id===pid); const s=(p.sessions[TODAY]||[])[idx];
  if(!s) return;
  s.status = s.status==='open' ? 'paused' : 'open';
  aDaily(); toast(s.status==='open' ? '已开放预约' : '已暂停预约');
}
function dailyCap(pid,idx){
  const p=projects.find(x=>x.id===pid); const s=(p.sessions[TODAY]||[])[idx];
  openModal(`<div class="mt">调整可预约人数</div>
    <div class="mb">${TODAY} · ${s.start}–${s.end}　当前已约 ${s.booked} 人</div>
    <div style="text-align:center;margin-top:6px"><div class="stepper">
      <button onclick="stepCap(-1)">−</button><div class="v" id="capv">${s.max}</div><button onclick="stepCap(1)">+</button>
    </div></div>
    <div class="macts"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveCap('${pid}',${idx})">保存</button></div>`);
}
function stepCap(n){ const v=document.getElementById('capv'); v.textContent=Math.max(1,(+v.textContent)+n); }
function saveCap(pid,idx){
  const p=projects.find(x=>x.id===pid); const s=(p.sessions[TODAY]||[])[idx];
  const nv=+document.getElementById('capv').textContent||8;
  if(s.booked>nv) return toast('新人数小于已约人数（'+s.booked+'），不可设置');
  s.max=nv; closeModal(); aDaily(); toast('人数已更新');
}
function dailyAdd(pid){
  openModal(`<div class="mt">增加今日场次 · ${TODAY}</div>
    <div class="mb">为该项目今日新增一个场次。</div>
    <div class="grp"><div class="label" style="font-size:12px;color:var(--ink-3)">时间段</div>
      <div class="time2"><input type="time" id="ds" value="16:00"><span>–</span><input type="time" id="de" value="17:30"></div></div>
    <div class="grp"><div class="label" style="font-size:12px;color:var(--ink-3)">最大预约人数（默认 8）</div>
      <input type="number" id="dmax" value="8"></div>
    <div class="macts"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="doDailyAdd('${pid}')">保存场次</button></div>`);
}
function doDailyAdd(pid){
  const s=document.getElementById('ds').value,e=document.getElementById('de').value,mx=+document.getElementById('dmax').value||8;
  const p=projects.find(x=>x.id===pid);
  if(!p.sessions[TODAY]) p.sessions[TODAY]=[];
  p.sessions[TODAY].push({start:s,end:e,max:mx,booked:0,status:'open'});
  if(!p.openDays.includes(TODAY)) p.openDays.push(TODAY);
  closeModal(); aDaily(); toast('已新增今日场次');
}

    <div class="card">

      <div class="field"><div class="label">SecretKey</div><input id="sKey" placeholder="${c.hasSecret?'已配置，留空不改':'腾讯云 SecretKey'}"></div>

function saveSms(){

}

/* ---- 店铺菜单管理（admin：新增 / 编辑 / 上下架 / 删除） ---- */
function aProducts(){
  const html=`<div class="row between" style="margin-bottom:8px">
      <div class="bold">店铺菜单</div>
      <div class="btn sm" onclick="editProduct()">+ 新增产品</div>
    </div>
    ${products.map(p=>`
      <div class="card">
        <div class="row" style="gap:12px;align-items:flex-start">
          <div class="prod-logo">${p.image?`<img src="${p.image}">`:'<span class="ph">图</span>'}</div>
          <div class="col" style="flex:1">
            <div class="row between"><div class="bold">${p.name}</div><span class="badge ${p.status==='on'?'ok':'draft'}">${p.status==='on'?'在售':'下架'}</span></div>
            <div class="xs muted" style="margin-top:4px">¥${p.price} · ${p.desc}</div>
            <div class="xs muted" style="margin-top:4px">评价 ${p.reviews.filter(r=>!r.hidden).length}</div>
          </div>
        </div>
        <div class="ops" style="margin-top:10px">
          <button class="btn ghost sm" onclick="editProduct('${p.id}')">编辑</button>
          <button class="btn ghost sm" onclick="toggleProduct('${p.id}')">${p.status==='on'?'下架':'上架'}</button>
          <button class="btn ghost sm" onclick="delProduct('${p.id}')">删除</button>
        </div>
      </div>`).join('')}
    <div class="note">上架产品在顾客端首页「店铺菜单」展示；下架不可见。评价管理见「评价管理」。</div>`;
  nav(html,'店铺菜单管理');
}
function toggleProduct(id){ const p=products.find(x=>x.id===id); p.status = p.status==='on'?'off':'on'; toast(p.status==='on'?'已上架':'已下架'); aProducts(); }
function delProduct(id){ const p=products.find(x=>x.id===id); products.splice(products.indexOf(p),1); toast('已删除'); aProducts(); }
let _curImg='';
function editProduct(id){
  const p=(id && products.find(x=>x.id===id)) || {name:'',image:'',price:30,desc:''};
  _curImg = p.image||'';
  openSheet(`<div class="sh">${id?'编辑':'新增'}产品</div>
    <div class="grp"><div class="gl">图片（菜品为图片，非图标）</div>
      <div class="up" id="pup" onclick="fakeUp('pup')">${_curImg?`<img src="${_curImg}">`:'＋ 上传图片'}</div>
    </div>
    <div class="grp"><div class="gl">名称</div><input class="t" id="pname" value="${p.name}"></div>
    <div class="grp"><div class="gl">价格（元）</div><input class="t" type="number" id="pprice" value="${p.price}"></div>
    <div class="grp"><div class="gl">描述</div><textarea id="pdesc" class="fld" style="height:60px" rows="3">${p.desc}</textarea></div>
    <div class="opt" onclick="saveProduct('${id||''}')"><div>保存</div></div>
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function fakeUp(id){ // 演示：用占位图模拟已上传图片（真实小程序走 wx.chooseMedia → wx.cloud.uploadFile 存云存储）
  _curImg="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200'><rect width='300' height='200' fill='%23EDE6DD'/><text x='150' y='108' font-size='16' fill='%237A5230' text-anchor='middle' font-family='sans-serif'>已上传图片</text></svg>";
  const u=document.getElementById(id); u.innerHTML=`<img src="${_curImg}">`;
}
function saveProduct(id){
  const name=document.getElementById('pname').value.trim()||'未命名';
  const price=+document.getElementById('pprice').value||0;
  const desc=document.getElementById('pdesc').value.trim();
  const existing = id ? products.find(x=>x.id===id) : null;
  if(existing){ existing.name=name; existing.price=price; existing.desc=desc; existing.image=_curImg; }
  else products.push({id:'m'+Date.now(),name,emoji:'☕',image:_curImg,price,desc,status:'on',reviews:[]});
  closeSheet(); aProducts(); toast('已保存');
}
/* ---- 评价管理（admin：隐藏 / 删除） ---- */
function aReviews(){
  const all=[];
  products.forEach(p=>p.reviews.forEach(r=>all.push({p,r})));
  all.sort((a,b)=>(b.r.pinned?1:0)-(a.r.pinned?1:0));
  const html=`<div class="sec">评价管理</div>
    ${ all.length ? all.map(({p,r})=>`
      <div class="card">
        <div class="row between"><div class="row"><span class="brand-dot"></span><span class="bold" style="font-size:13px">${p.name}</span>${r.pinned?'<span class="badge ok" style="margin-left:6px">置顶</span>':''}</div>
          <span class="badge ${r.hidden?'draft':'review'}">${r.hidden?'已隐藏':'显示中'}</span></div>
        <div class="rev">
          <div class="av">${r.avatar}</div>
          <div class="col" style="flex:1">
            <div class="row between"><div class="bold" style="font-size:13px">${r.nick}</div><div class="rt">${r.at}</div></div>
            <div class="stars" style="pointer-events:none;margin:3px 0">${starStr(r.rating)}</div>
            <div class="xs" style="margin-top:2px">${r.text}</div>
          </div>
        </div>
        <div class="ops" style="margin-top:8px">
          <button class="btn ghost sm" onclick="togglePin('${p.id}','${r.id}')">${r.pinned?'取消置顶':'置顶'}</button>
          <button class="btn ghost sm" onclick="toggleReview('${p.id}','${r.id}')">${r.hidden?'显示':'隐藏'}</button>
          <button class="btn ghost sm" onclick="delReview('${p.id}','${r.id}')">删除</button>
        </div>
      </div>`).join('')
    : '<div class="note">暂无评价。</div>' }
    <div class="note">可按菜品管理评价：置顶（优先展示）、隐藏（保留记录）、删除。置顶项排在最前。</div>`;
  nav(html,'评价管理');
}
function togglePin(pid,rid){ const p=products.find(x=>x.id===pid); const r=p.reviews.find(x=>x.id===rid); r.pinned=!r.pinned; aReviews(); toast(r.pinned?'已置顶':'已取消置顶'); }
function toggleReview(pid,rid){ const p=products.find(x=>x.id===pid); const r=p.reviews.find(x=>x.id===rid); r.hidden=!r.hidden; aReviews(); }
function delReview(pid,rid){ const p=products.find(x=>x.id===pid); p.reviews=p.reviews.filter(x=>x.id!==rid); aReviews(); toast('已删除评价'); }
