<title>步进器（数字选择）统一样式预览</title>
<style>
  :root {
    --ink:#1A1A1A; --ink-2:#555; --ink-3:#999; --line:#E7E7E7;
    --fill:#F5F5F5; --fill-2:#FAFAFA; --brand:#7A5230;
  }
  * { box-sizing: border-box; font-family: -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  body { margin:0; background:#EEE; padding:24px; color:var(--ink); }
  .wrap { max-width: 390px; margin:0 auto; }
  h3 { font-size:14px; color:var(--ink-2); font-weight:600; margin:0 0 12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:20px; }
  .field { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .field:last-child { border-bottom:none; }
  .label { font-size:12px; color:var(--ink-3); }
  .hint { font-size:11px; color:var(--ink-3); margin-top:3px; }

  /* ===== 统一后的步进器（与 app.wxss 同规范，rpx→px 0.5 比例） ===== */
  .stepper {
    display:inline-flex; align-items:stretch;
    border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff;
  }
  .stepper button {
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; padding:0; margin:0; background:#fff; color:var(--ink);
    font-size:18px; font-weight:400; line-height:1; border:none; border-radius:0; cursor:pointer;
  }
  .stepper button::after { border:none; }
  .stepper button:active { background:var(--fill); }
  .stepper .v {
    display:flex; align-items:center; justify-content:center;
    min-width:36px; padding:0 5px; color:var(--ink);
    font-size:14px; font-weight:600; line-height:1;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }

  /* 对照：未修复前的旧写法（line-height 撑高 + 微信默认 ::after 边框未去） */
  .stepper-old { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:5px; background:#fff; }
  .stepper-old button { width:28px; height:28px; line-height:28px; background:#fff; font-size:16px; border:1px solid #ccc; border-radius:0; }
  .stepper-old .v { min-width:32px; text-align:center; }
</style>
</head>
