<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二曜路8号 · 配置重构原型 v2（复刻已发布版视觉）</title>
<style>
  :root{
    --ink:#1A1A1A; --ink-2:#555; --ink-3:#999;
    --line:#E7E7E7; --fill:#F5F5F5; --fill-2:#FAFAFA;
    --brand:#7A5230;          /* 棕色：仅点缀，不做背景 */
    --orange:#E8833A;         /* 今天橘色圈，仅此一处用彩色 */
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#EDEDED;font-family:-apple-system,"PingFang SC","Helvetica Neue",Helvetica,sans-serif;color:var(--ink);
       display:flex;justify-content:center;padding:24px;gap:32px;flex-wrap:wrap}
  /* 手机外框 */
  .phone{width:390px;background:var(--fill-2);border:1px solid #ddd;border-radius:38px;overflow:hidden;
         box-shadow:0 12px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;height:840px}
  .statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;color:var(--ink)}
  .navbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
          background:#fff;border-bottom:1px solid var(--line)}
  .navbar .t{font-weight:600;font-size:16px}
  .navbar .bk,.navbar .rt{font-size:15px;color:var(--ink-2);min-width:44px}
  .navbar .rt{text-align:right}
  .screen{flex:1;overflow-y:auto;background:var(--fill);padding:16px}
  .screen::-webkit-scrollbar{width:0}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .sec{font-weight:600;font-size:14px;margin-bottom:10px}
  .row{display:flex;align-items:center}
  .between{justify-content:space-between}
  .col{display:flex;flex-direction:column}
  .muted{color:var(--ink-3);font-size:12px}
  .sm{font-size:12px}.xs{font-size:11px}
  .bold{font-weight:600}
  .brand-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:6px;vertical-align:middle}
  .brand-text{color:var(--brand)}
  /* 按钮 */
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;
       border:1px solid var(--ink);border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .btn.block{width:100%;margin-top:6px}
  .btn[disabled]{opacity:.4}
  /* 徽标：靠描边/字重/填充，不引入彩色 */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--ink-2)}
  .badge.ok{border-color:var(--ink);color:var(--ink);font-weight:600}
  .badge.paused{border-style:dashed;color:var(--ink-3)}
  .badge.full{background:var(--fill);color:var(--ink-3)}
  .badge.draft{background:var(--fill);color:var(--ink-3);border-color:var(--line)}
  .badge.shelf{color:var(--ink-3);border-style:dashed}
  /* chip */
  .chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;cursor:pointer}
  .chip.on{border-color:var(--ink);font-weight:600}
  /* 卡片列表项 */
  .item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .menu .mi{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .menu .mi:last-child{border-bottom:none}
  .menu .ma{color:var(--ink-3)}
  .menu .mt{font-weight:500}
  /* 表单 */
  .field{padding:10px 0;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:none}
  .field .label{font-size:11px;color:var(--ink-3);margin-bottom:4px}
  .field input,.field textarea{width:100%;border:none;font-size:13px;outline:none;background:transparent;font-family:inherit}
  .switch{position:relative;width:42px;height:24px;background:var(--line);border-radius:999px;transition:.2s;flex:none}
  .switch.on{background:var(--ink)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
  .switch.on::after{left:20px}
  /* 日历（复用已发布版逻辑） */
  .cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-title{font-weight:600;font-size:13px}
  .cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-week{margin-bottom:5px}
  .cw{text-align:center;font-size:11px;color:var(--ink-3)}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;font-size:12px;cursor:pointer;position:relative}
  .cell.empty{border:none}
  .cell.open{border-color:var(--ink)}
  .cell.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cell.today:not(.sel)::after{content:"";position:absolute;inset:3px;border:2px solid var(--orange);border-radius:7px}
  .cell.today:not(.sel){color:var(--orange);font-weight:600}
  .legend{display:flex;align-items:center;font-size:10px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap;gap:3px}
  .legend .dot{width:9px;height:9px;border-radius:50%;margin-right:3px}
  .legend .dot.open{background:#fff;border:2px solid var(--ink);margin-left:10px}
  .legend .dot.today{background:#fff;border:2px solid var(--orange);margin-left:10px}
  .legend .dot.sel{background:var(--ink);margin-left:10px}
  /* 每日场次块 */
  .dayblock{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  .dayblock.gray{background:var(--fill);opacity:.7}
  .dayblock .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dayblock .dh .dt{font-weight:600;font-size:13px}
  .sess{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
  .sess .st{font-size:13px}
  .sess .sc{font-size:11px;color:var(--ink-2)}
  .ops{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .ops .btn{margin:0}
  .note{color:var(--ink-3);text-align:center;padding:20px;font-size:12px}
  .empty-sess{color:var(--ink-3);font-size:12px;padding:8px 0}
  /* 底部弹出层 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:50}
  .mask.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:390px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px 26px;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet .sh{font-weight:600;font-size:15px;text-align:center;margin-bottom:14px}
  .sheet .opt{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .sheet .opt:last-of-type{border-bottom:none}
  .sheet .opt .sub{font-size:11px;color:var(--ink-3)}
  .sheet .cancel{margin-top:12px;text-align:center;padding:13px;color:var(--ink-2);font-size:14px;background:var(--fill);border-radius:12px;cursor:pointer}
  .sheet .seg{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
  .sheet .seg .chip{cursor:pointer}
  .sheet input.t{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;width:100%;font-family:inherit;outline:none}
  .sheet .grp{margin-bottom:14px}
  .sheet .grp .gl{font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .sheet .ck{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
  .sheet .ck:last-child{border-bottom:none}
  .sheet .ck .req{font-size:10px;color:var(--ink-3);margin-left:6px}
  .time2{display:flex;align-items:center;gap:8px}
  .time2 input{font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;width:90px;text-align:center;font-family:inherit;outline:none}
  /* 标签式小标 */
  .pill{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px}
  .tag-brand{color:var(--brand);border-color:var(--brand)}
  .tab{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .tab .tb{flex:1;text-align:center;padding:9px;font-size:12px;cursor:pointer}
  .tab .tb.on{background:var(--ink);color:#fff}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border-bottom:none}
  .center{text-align:center}
</style>
</head>
<body>

<!-- ============ 管理端手机 ============ -->
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>📶 ☀ 100%</span></div>
  <div class="navbar">
    <div class="bk" onclick="navBack()">〈</div>
    <div class="t" id="navTitle">管理台</div>
    <div class="rt" id="navRight"></div>
  </div>
  <div class="screen" id="screen"></div>
</div>

<!-- 底部弹出层 -->
<div class="mask" id="mask" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ---------- 数据（演示用） ---------- */
const today = new Date();
const Y = today.getFullYear(), M = today.getMonth()+1;
const pad = n => String(n).padStart(2,'0');
const ymd = (y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const TODAY = ymd(Y,M,today.getDate());

const state = {
  project: null,
  selDate: TODAY,
  month: M, year: Y,
  selected: []   // 批量选择集
};

const projects = [
  { id:'p1', name:'法兰绒深烘咖啡预约', published:true, paused:false,
    openDays:[ymd(Y,M,8),ymd(Y,M,9),ymd(Y,M,10),ymd(Y,M,15),ymd(Y,M,16)],
    sessions:{
      [ymd(Y,M,8)]:[{start:'10:00',end:'11:30',max:8},{start:'14:00',end:'15:30',max:8}],
      [ymd(Y,M,9)]:[{start:'10:00',end:'11:30',max:8}],
      [ymd(Y,M,15)]:[]
    },
    g:{ needReview:true, paused:false, limit:{period:'每天',count:2,adminFree:true},
        open:{type:'提前天数',adv:3}, cutoff:{type:'场次前',hours:2},
        fields:['name','phone','wechat'] }
  },
  { id:'p2', name:'手冲单品咖啡预约', published:false, paused:false,
    openDays:[ymd(Y,M,12),ymd(Y,M,13)], sessions:{}, g:{needReview:false,paused:false,
        limit:{period:'每天',count:1,adminFree:true},open:{type:'提前天数',adv:1},cutoff:{type:'当日',time:'18:00'},fields:['name','phone']} },
  { id:'p3', name:'周末清酒品鉴', published:true, paused:true,
    openDays:[ymd(Y,M,20)], sessions:{}, g:{needReview:true,paused:true,
        limit:{period:'每周',count:3,adminFree:true},open:{type:'提前天数',adv:5},cutoff:{type:'场次前',hours:4},fields:['name','phone','wechat']} }
];

const templates = [
  { id:'t1', name:'平日双场', slots:[{start:'10:00',end:'11:30',max:8},{start:'14:00',end:'15:30',max:8}] },
  { id:'t2', name:'周末单场', slots:[{start:'15:00',end:'17:00',max:12}] }
];

const fieldCatalog = [
  {k:'name',label:'姓名',req:true,lock:true},
  {k:'phone',label:'手机号',req:true,lock:true},
  {k:'wechat',label:'微信号',req:false,lock:false},
  {k:'note',label:'备注',req:false,lock:false},
  {k:'gender',label:'性别',req:false,lock:false},
  {k:'age',label:'年龄',req:false,lock:false},
  {k:'companion',label:'同行人员',req:false,lock:false}
];

/* ---------- 路由 ---------- */
const stack = [];
function nav(html, title, right){ stack.push({title,right}); render(html,title,right); }
function navBack(){ if(stack.length){ stack.pop(); const prev = stack[stack.length-1]; render(prev.html, prev.title, prev.right);} }
function render(html,title,right){
  document.getElementById('screen').innerHTML = html;
  document.getElementById('navTitle').textContent = title||'';
  document.getElementById('navRight').innerHTML = right||'';
  document.getElementById('screen').scrollTop = 0;
  // 把 html 存回当前栈顶
  if(stack.length){ stack[stack.length-1].html = html; stack[stack.length-1].title=title; stack[stack.length-1].right=right; }
}

/* ---------- 通用组件 ---------- */
function badge(p){
  if(p.deleted) return '<span class="badge full">已删除</span>';
  if(!p.published) return '<span class="badge draft">草稿</span>';
  if(p.paused)    return '<span class="badge paused">已下架</span>';
  return '<span class="badge ok">已发布</span>';
}
function pubState(p){
  if(!p.published) return '草稿';
  if(p.paused) return '下架';
  return '已发布';
}
function bookState(p){ return p.paused ? '暂停预约' : '开放预约'; }

/* ============ 各屏 ============ */
function hub(){
  const menus = [
    {t:'项目管理',u:'projects'},{t:'项目配置（时间/场次）',u:'config'},
    {t:'场次模版',u:'templates'},{t:'查看预约',u:'view'},{t:'管理员',u:'admins'}
  ];
  const html = `<div class="card">
      <div class="row between"><div class="bold">管理台</div>
      <span class="badge ok">超级管理员</span></div>
    </div>
    <div class="card menu">
      ${menus.map(m=>`<div class="mi" onclick="go('${m.u}')"><div class="mt">${m.t}</div><div class="ma">›</div></div>`).join('')}
    </div>
    <button class="btn ghost block" onclick="toast('已退出管理端')">退出管理端</button>`;
  nav(html,'管理台');
}
function go(u){
  if(u==='projects') return projectsScreen();
  if(u==='config'){ state.project = projects[0]; return configScreen(); }
  if(u==='templates') return templatesScreen();
  if(u==='view') return viewScreen();
  if(u==='admins') return adminsHint();
}
function adminsHint(){
  nav(`<div class="card"><div class="sec">管理员</div>
    <div class="kv"><span>超级管理员</span><span class="badge ok">1</span></div>
    <div class="kv"><span>普通管理员</span><span class="badge">0</span></div>
    <div class="note">多管理员能力已具备，详见需求文档 §1。</div></div>`,'管理员');
}

/* ---- 项目管理 ---- */
function projectsScreen(){
  const html = `<div class="row between" style="margin-bottom:8px">
      <div class="bold">预约项目</div>
      <div class="btn sm" onclick="toast('弹出新建项目表单')">+ 新建</div>
    </div>
    ${projects.map(p=>`
      <div class="card" onclick="openProject('${p.id}')">
        <div class="row between">
          <div class="row"><span class="brand-dot"></span><span class="bold">${p.name}</span></div>
          ${badge(p)}
        </div>
        <div class="xs muted" style="margin-top:6px">发布状态：${pubState(p)} · 预约：${bookState(p)} · 可约日 ${p.openDays.length} 天</div>
        <div class="ops" onclick="event.stopPropagation()">
          ${ p.published
              ? (p.paused
                  ? `<button class="btn sm" onclick="togglePause('${p.id}')">上架</button>`
                  : `<button class="btn sm" onclick="togglePause('${p.id}')">下架</button>`)
              : `<button class="btn sm" id="pub-${p.id}" onclick="publish('${p.id}')">发布</button>` }
          <button class="btn ghost sm" onclick="toggleBooking('${p.id}')">${p.paused?'开放预约':'暂停预约'}</button>
          <button class="btn ghost sm" onclick="confirmDelete('${p.id}')">删除</button>
        </div>
      </div>`).join('')}
    <div class="note">点击项目卡片 → 进入「项目配置」统一编辑时间/场次。</div>`;
  nav(html,'项目管理');
}
function openProject(id){ state.project = projects.find(p=>p.id===id); configScreen(); }
function publish(id){ const p=projects.find(x=>x.id===id); p.published=true; p.paused=false; projectsScreen(); }
function togglePause(id){ const p=projects.find(x=>x.id===id); p.published=!p.published; if(p.published)p.paused=false; projectsScreen(); }
function toggleBooking(id){ const p=projects.find(x=>x.id===id); p.paused=!p.paused; projectsScreen(); }
function confirmDelete(id){
  openSheet(`<div class="sh">删除项目</div>
    <div class="note" style="padding:6px 0 14px">删除后将在列表标记为「已删除」（可恢复），不影响历史预约记录。</div>
    <div class="opt" onclick="doDelete('${id}')"><div>确认删除</div><div class="sub" style="color:var(--ink-3)">软删除 · 可回退</div></div>
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function doDelete(id){ const p=projects.find(x=>x.id===id); p.deleted=true; closeSheet(); projectsScreen(); }

/* ---- 项目配置（时间设置 + 场次 + 全局设定 统一） ---- */
function configScreen(){
  const p = state.project;
  const html = `
    <div class="card row between tap" onclick="pickProject()">
      <div class="bold">${p.name}</div><div class="muted">切换 ›</div>
    </div>

    <!-- ① 项目时间设置：日历 -->
    <div class="card">
      <div class="sec">项目时间设置 <span class="pill tag-brand">最先配置</span></div>
      ${calHTML(p)}
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn sm" onclick="batchOpen()">批量开放选中</button>
        <button class="btn ghost sm" onclick="batchClose()">批量关闭</button>
      </div>
      <div class="legend">
        <span class="dot open"></span>可约
        <span class="dot today"></span>今天
        <span class="dot sel"></span>已选
      </div>
    </div>

    <!-- ② 按日期向下展开场次块 -->
    <div class="sec" style="margin:14px 4px 8px">每日场次（点日期下方展开）</div>
    ${dayBlocksHTML(p)}

    <!-- ③ 全局设定（由「全部设定」迁移而来） -->
    <div class="card" style="margin-top:14px">
      <div class="sec">全局设定</div>
      <div class="field row between"><div class="label">提交后是否审核</div><div class="switch ${p.g.needReview?'on':''}" onclick="sw('needReview')"></div></div>
      <div class="field row between"><div class="label">暂停/开放预约</div><div class="switch ${p.g.paused?'on':''}" onclick="sw('paused')"></div></div>
      <div class="field row between tap" onclick="sheetLimit()"><div class="label">预约次数限制</div>
        <div class="row"><span class="muted" style="margin-right:6px">${p.g.limit.period} · ${p.g.limit.count} 次${p.g.limit.adminFree?' · 管理员不限':''}</span><span class="muted">›</span></div></div>
      <div class="field row between tap" onclick="sheetOpen()"><div class="label">预约开放规则</div>
        <div class="row"><span class="muted" style="margin-right:6px">${p.g.open.type} ${p.g.open.adv?p.g.open.adv+'天':p.g.open.time||''}</span><span class="muted">›</span></div></div>
      <div class="field row between tap" onclick="sheetCutoff()"><div class="label">预约截止规则</div>
        <div class="row"><span class="muted" style="margin-right:6px">${p.g.cutoff.type} ${p.g.cutoff.hours?p.g.cutoff.hours+'小时':p.g.cutoff.time||''}</span><span class="muted">›</span></div></div>
      <div class="field row between tap" onclick="sheetFields()"><div class="label">提交预约信息设置</div>
        <div class="row"><span class="muted" style="margin-right:6px">${p.g.fields.length} 项</span><span class="muted">›</span></div></div>
    </div>
    <div class="note">时间设置 / 场次 / 全局设定 均已合并到本页；发布与下架入口在「项目管理」。</div>`;
  nav(html,'项目配置');
}
function pickProject(){
  openSheet(`<div class="sh">切换项目</div>${projects.map(p=>`<div class="opt" onclick="chooseProject('${p.id}')"><div>${p.name}</div><div class="sub">${pubState(p)}</div></div>`).join('')}<div class="cancel" onclick="closeSheet()">取消</div>`);
}
function chooseProject(id){ closeSheet(); state.project=projects.find(p=>p.id===id); configScreen(); }
function sw(key){ if(key==='needReview') state.project.g.needReview=!state.project.g.needReview; if(key==='paused') state.project.g.paused=!state.project.g.paused; configScreen(); }

/* 日历渲染（复用已发布逻辑） */
function calHTML(p){
  const y=state.year,m=state.month;
  const first=new Date(y,m-1,1).getDay();
  const days=new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<first;i++) cells+=`<div class="cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=ymd(y,m,d);
    const open=p.openDays.includes(k);
    const sel=state.selDate===k;
    const isToday=k===TODAY;
    cells+=`<div class="cell ${open?'open':''} ${sel?'sel':''} ${isToday?'today':''}" onclick="pickDate('${k}')">${d}</div>`;
  }
  return `<div class="cal">
    <div class="cal-hd">
      <div class="btn ghost sm" onclick="calMove(-1)">‹</div>
      <div class="cal-title">${y} 年 ${m} 月</div>
      <div class="btn ghost sm" onclick="calMove(1)">›</div>
    </div>
    <div class="cal-week">${['日','一','二','三','四','五','六'].map(w=>`<div class="cw">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}
function calMove(d){ let m=state.month+d; let y=state.year; if(m<1){m=12;y--;} if(m>12){m=1;y++;} state.month=m; state.year=y; configScreen(); }
function pickDate(k){ state.selDate=k; configScreen(); scrollToDay(k); }
function scrollToDay(k){ setTimeout(()=>{ const el=document.getElementById('day-'+k); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); },60); }

/* 每日场次块（已开放 + 置灰未开放） */
function dayBlocksHTML(p){
  // 构造本月 1..days
  const y=state.year,m=state.month, days=new Date(y,m,0).getDate();
  let out='';
  for(let d=1;d<=days;d++){
    const k=ymd(y,m,d);
    const open=p.openDays.includes(k);
    if(!open){ // 置灰展示（Q11 已定：置灰展示）
      out+=`<div class="dayblock gray" id="day-${k}">
        <div class="dh"><div class="dt">${k} <span class="xs muted">未开放</span></div></div>
        <div class="empty-sess">该日未开放预约</div></div>`;
      continue;
    }
    const sess=(p.sessions[k]||[]);
    out+=`<div class="dayblock" id="day-${k}">
      <div class="dh"><div class="dt">${k}</div>
        <div class="ops">
          <button class="btn ghost sm" onclick="addSession('${k}')">+ 添加场次</button>
          <button class="btn ghost sm" onclick="useTemplate('${k}')">选用模版</button>
          <button class="btn ghost sm" onclick="copyDay('${k}')">复制</button>
        </div>
      </div>
      ${ sess.length ? sess.map((s,i)=>`<div class="sess"><div class="st">${s.start} – ${s.end}</div>
          <div class="sc">限 ${s.max} 人 · 剩 ${s.max} <span class="muted">名额</span></div></div>`).join('')
        : `<div class="empty-sess">暂无场次，点「选用模版」快速套用</div>` }
    </div>`;
  }
  return out;
}
function addSession(k){
  const p=state.project;
  openSheet(`<div class="sh">添加场次 · ${k}</div>
    <div class="grp"><div class="gl">时间段</div>
      <div class="time2"><input type="time" id="ss" value="10:00"><span>–</span><input type="time" id="se" value="11:30"></div></div>
    <div class="grp"><div class="gl">最大预约人数（默认 8）</div>
      <input class="t" type="number" id="smax" value="8"></div>
    <div class="opt" onclick="doAddSession('${k}')"><div>保存场次</div></div>
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function doAddSession(k){
  const s=document.getElementById('ss').value, e=document.getElementById('se').value, mx=+document.getElementById('smax').value||8;
  if(!state.project.sessions[k]) state.project.sessions[k]=[];
  state.project.sessions[k].push({start:s,end:e,max:mx});
  closeSheet(); configScreen();
}
function useTemplate(k){
  openSheet(`<div class="sh">选用模版 · ${k}</div>
    ${templates.map(t=>`<div class="opt" onclick="applyTemplate('${k}','${t.id}')"><div>${t.name}</div>
      <div class="sub">${t.slots.length} 场 · ${t.slots[0].start}-${t.slots[0].end}</div></div>`).join('')}
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function applyTemplate(k,tid){
  const t=templates.find(x=>x.id===tid);
  state.project.sessions[k]=t.slots.map(s=>({start:s.start,end:s.end,max:s.max}));
  closeSheet(); configScreen();
}
function copyDay(k){
  openSheet(`<div class="sh">复制 ${k} 的场次</div>
    <div class="opt" onclick="doCopy('${k}','day')"><div>复制到指定某天</div><div class="sub">选择目标日期</div></div>
    <div class="opt" onclick="doCopy('${k}','month')"><div>复制到本月所有开放日</div></div>
    <div class="opt" onclick="doCopy('${k}','all')"><div>复制到全局所有开放日</div><div class="sub">本项目全周期</div></div>
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function doCopy(k,mode){
  const src=state.project.sessions[k]||[];
  if(mode==='day'){
    openSheet(`<div class="sh">选择目标日期</div>
      <input class="t" type="date" id="cpyday" value="${k}">
      <div class="opt" onclick="applyCopy('${k}','day')"><div>确认复制</div></div>
      <div class="cancel" onclick="copyDay('${k}')">返回</div>`);
    return;
  }
  if(mode==='month'){
    state.project.openDays.forEach(d=>{ if(d.startsWith(ymd(state.year,state.month,1).slice(0,7))) state.project.sessions[d]=src.map(s=>({...s})); });
  } else { // all
    state.project.openDays.forEach(d=>{ state.project.sessions[d]=src.map(s=>({...s})); });
  }
  closeSheet(); configScreen();
}
function applyCopy(k,mode){
  const tgt=document.getElementById('cpyday').value;
  state.project.sessions[tgt]=(state.project.sessions[k]||[]).map(s=>({...s}));
  if(!state.project.openDays.includes(tgt)) state.project.openDays.push(tgt);
  closeSheet(); configScreen();
}
function batchOpen(){
  state.selected.forEach(d=>{ if(!state.project.openDays.includes(d)) state.project.openDays.push(d); });
  state.selected=[]; configScreen(); toast('已批量开放选中日期');
}
function batchClose(){
  state.project.openDays=state.project.openDays.filter(d=>!state.selected.includes(d));
  state.selected=[]; configScreen(); toast('已批量关闭选中日期');
}

/* 周期规则弹层：次数限制 / 开放规则 / 截止规则 */
function sheetLimit(){
  const g=state.project.g.limit;
  openSheet(`<div class="sh">预约次数限制</div>
    <div class="grp"><div class="gl">周期</div><div class="seg" id="lp">
      ${['每天','每周','每月','永久'].map(x=>`<span class="chip ${g.period===x?'on':''}" onclick="segPick('lp',this,'${x}')">${x}</span>`).join('')}
    </div></div>
    <div class="grp"><div class="gl">周期内可提交次数</div><input class="t" type="number" id="lc" value="${g.count}"></div>
    <div class="ck"><div>管理员不受次数限制</div><div class="switch ${g.adminFree?'on':''}" onclick="swLimitFree()"></div></div>
    <div class="opt" onclick="saveLimit()"><div>保存</div></div>
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function swLimitFree(){ state.project.g.limit.adminFree=!state.project.g.limit.adminFree; document.querySelector('#mask .switch').classList.toggle('on'); }
function saveLimit(){
  const p=state.project.g.limit;
  p.period=document.getElementById('lp').dataset.v||p.period;
  p.count=+document.getElementById('lc').value||1;
  closeSheet(); configScreen();
}
function sheetOpen(){
  const g=state.project.g.open;
  openSheet(`<div class="sh">预约开放规则</div>
    <div class="grp"><div class="gl">口径</div><div class="seg" id="ot">
      ${['提前天数','指定日期'].map(x=>`<span class="chip ${g.type===x?'on':''}" onclick="segPick('ot',this,'${x}')">${x}</span>`).join('')}
    </div></div>
    <div class="grp"><div class="gl">可提前天数（1–30）</div><input class="t" type="number" id="oc" value="${g.adv||''}" placeholder="如 3"></div>
    <div class="ck"><div>管理员特权（不受限制）</div><div class="switch on"></div></div>
    <div class="opt" onclick="saveOpen()"><div>保存</div></div>
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function saveOpen(){ const g=state.project.g.open; g.type=document.getElementById('ot').dataset.v||g.type; g.adv=+document.getElementById('oc').value||1; closeSheet(); configScreen(); }
function sheetCutoff(){
  const g=state.project.g.cutoff;
  openSheet(`<div class="sh">预约截止规则</div>
    <div class="grp"><div class="gl">口径</div><div class="seg" id="ct">
      ${['场次前','当日'].map(x=>`<span class="chip ${g.type===x?'on':''}" onclick="segPick('ct',this,'${x}')">${x}</span>`).join('')}
    </div></div>
    <div class="grp"><div class="gl" id="ctlbl">${g.type==='场次前'?'提前小时数':'当日截止时间'}</div>
      ${g.type==='场次前'
        ? `<input class="t" type="number" id="cv" value="${g.hours||''}" placeholder="如 2">`
        : `<input class="t" type="time" id="cv" value="${g.time||'18:00'}">`}</div>
    <div class="ck"><div>管理员特权（不受限制）</div><div class="switch on"></div></div>
    <div class="opt" onclick="saveCutoff()"><div>保存</div></div>
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function saveCutoff(){ const g=state.project.g.cutoff; g.type=document.getElementById('ct').dataset.v||g.type;
  if(g.type==='场次前') g.hours=+document.getElementById('cv').value||2; else g.time=document.getElementById('cv').value; closeSheet(); configScreen(); }
function segPick(id,el,v){ document.getElementById(id).dataset.v=v; [...el.parentNode.children].forEach(c=>c.classList.remove('on')); el.classList.add('on'); }

/* 提交预约信息设置 */
function sheetFields(){
  const p=state.project;
  openSheet(`<div class="sh">提交预约信息设置</div>
    ${fieldCatalog.map(f=>{
      const on=p.g.fields.includes(f.k);
      const lock=f.lock;
      return `<div class="ck"><div>${f.label}${f.req?'<span class="req">必填·不可取消</span>':''}</div>
        ${lock?`<div class="switch on" style="opacity:.5"></div>`
              :`<div class="switch ${on?'on':''}" onclick="toggleField('${f.k}',this)"></div>`}</div>`;
    }).join('')}
    <div class="note" style="padding:8px 0">可新增项：备注 / 性别 / 年龄 / 同行人员（已列于上方，开启即可收集）。</div>
    <div class="opt" onclick="closeSheet()"><div>完成</div></div>`);
}
function toggleField(k,el){ el.classList.toggle('on'); const arr=state.project.g.fields; const i=arr.indexOf(k);
  if(i>=0) arr.splice(i,1); else arr.push(k); }

/* ---- 场次模版（admin） ---- */
function templatesScreen(){
  const html=`<div class="row between" style="margin-bottom:8px">
      <div class="bold">场次模版</div>
      <div class="btn sm" onclick="editTemplate()">+ 新增模版</div>
    </div>
    ${templates.map(t=>`
      <div class="card">
        <div class="row between"><div class="bold">${t.name}</div><span class="badge">${t.slots.length} 场</span></div>
        ${t.slots.map(s=>`<div class="kv"><span>${s.start} – ${s.end}</span><span class="muted">限 ${s.max} 人</span></div>`).join('')}
        <div class="ops"><button class="btn ghost sm" onclick="editTemplate('${t.id}')">编辑</button>
          <button class="btn ghost sm" onclick="toast('已删除模版')">删除</button></div>
      </div>`).join('')}
    <div class="note">模版全 admin 共享，可在「项目配置 → 选用模版」中套用。</div>`;
  nav(html,'场次模版');
}
function editTemplate(id){
  const t=id?templates.find(x=>x.id===id):{name:'',slots:[{start:'10:00',end:'11:30',max:8}]};
  openSheet(`<div class="sh">${id?'编辑':'新增'}模版</div>
    <div class="grp"><div class="gl">模版名称</div><input class="t" id="tname" value="${t.name}"></div>
    <div class="grp"><div class="gl">场次（默认 8 人/场）</div>
      <div id="tslots">
        ${t.slots.map(s=>`<div class="time2" style="margin-bottom:8px"><input type="time" class="tstart" value="${s.start}"><span>–</span><input type="time" class="tend" value="${s.end}"><input class="tcap" type="number" value="${s.max}" style="width:54px;margin-left:6px"></div>`).join('')}
      </div>
      <div class="opt" onclick="addTSlot()"><div>+ 添加场次</div></div>
    </div>
    <div class="opt" onclick="saveTemplate('${id||''}')"><div>保存模版</div></div>
    <div class="cancel" onclick="closeSheet()">取消</div>`);
}
function addTSlot(){ const c=document.getElementById('tslots'); const d=document.createElement('div');
  d.className='time2'; d.style.marginBottom='8px';
  d.innerHTML=`<input type="time" class="tstart" value="14:00"><span>–</span><input type="time" class="tend" value="15:30"><input class="tcap" type="number" value="8" style="width:54px;margin-left:6px">`;
  c.appendChild(d); }
function saveTemplate(id){
  const name=document.getElementById('tname').value||'未命名模版';
  const starts=[...document.querySelectorAll('.tstart')], ends=[...document.querySelectorAll('.tend')], caps=[...document.querySelectorAll('.tcap')];
  const slots=starts.map((s,i)=>({start:s.value,end:ends[i].value,max:+caps[i].value||8}));
  if(id){ const t=templates.find(x=>x.id===id); t.name=name; t.slots=slots; }
  else templates.push({id:'t'+Date.now(),name,slots});
  closeSheet(); templatesScreen();
}

/* ---- 查看预约 ---- */

      <div class="bold">${state.project?state.project.name:'法兰绒深烘咖啡预约'}</div><div class="muted">切换 ›</div></div>
    <div class="tab">

function pickViewProject(){
  openSheet(`<div class="sh">切换项目</div>${projects.map(p=>`<div class="opt" onclick="chooseView('${p.id}')"><div>${p.name}</div><div class="sub">${pubState(p)}</div></div>`).join('')}<div class="cancel" onclick="closeSheet()">取消</div>`);
}
function chooseView(id){ closeSheet(); state.project=projects.find(p=>p.id===id); viewScreen(); }

/* ---------- 弹出层工具 ---------- */
function openSheet(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('mask').classList.add('show'); }
function closeSheet(){ document.getElementById('mask').classList.remove('show'); }
function toast(m){ const o=document.createElement('div'); o.textContent=m; o.style.cssText='position:fixed;left:50%;top:60%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99'; document.body.appendChild(o); setTimeout(()=>o.remove(),1400); }

/* ---------- 启动 ---------- */
hub();
</script>
